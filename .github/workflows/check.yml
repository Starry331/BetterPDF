name: Cross-platform source checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:ui
      - run: npm run check
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
# Native pipeline and LAN round-trip tests require a vetted per-platform runtime.
# This workflow checks source compatibility; it does not publish installers.
