[package]
name = "bpdf"
version = "0.1.0"
description = "Offline PDF workspace"
authors = ["BPDF contributors"]
license = "AGPL-3.0-only"
edition = "2021"
default-run = "bpdf"
[build-dependencies]
tauri-build = { version = "2.6", features = [] }
[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
base64 = "0.22"
parking_lot = "0.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
pulldown-cmark = "0.13"
libc = "0.2"
regex = "1"
quick-xml = "0.42"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
